<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" role="img" aria-labelledby="title desc"><title id="title">Digitaalinen automyyjä osana kaupan kokonaispolkua</title><desc id="desc">Tavoitepolku: yhteydet varmennettava. Julkinen demo on ei-sitova. Ajoneuvoilmoitus → Listahinta tai neuvottelu → Sovittu hinta → Sopimus ja allekirjoitus → Maksu tai rahoitus → Luovutus</desc><rect width="900" height="690" rx="20" fill="#071b2e"/><g font-family="Arial,sans-serif"><text x="40" y="50" font-size="25" fill="white" font-weight="bold">Digitaalinen automyyjä osana kaupan kokonaispolkua</text><rect x="40" y="80" width="820" height="67" rx="10" fill="#173148"/><text x="60" y="109" fill="white" font-size="21" font-weight="bold">1. Ajoneuvoilmoitus</text><text x="60" y="133" fill="#e4eef9" font-size="16">Auto ja kuntotiedot</text><text x="443" y="162" fill="#9fdcff" font-size="21">↓</text><rect x="40" y="165" width="820" height="67" rx="10" fill="#214bbb"/><text x="60" y="194" fill="white" font-size="21" font-weight="bold">2. Listahinta tai neuvottelu</text><text x="60" y="218" fill="#e4eef9" font-size="16">Sales toimii liikkeen valtuuttamana</text><text x="443" y="247" fill="#9fdcff" font-size="21">↓</text><rect x="40" y="250" width="820" height="67" rx="10" fill="#214bbb"/><text x="60" y="279" fill="white" font-size="21" font-weight="bold">3. Sovittu hinta</text><text x="60" y="303" fill="#e4eef9" font-size="16">Samaa hintaa ei neuvotella uudelleen</text><text x="443" y="332" fill="#9fdcff" font-size="21">↓</text><rect x="40" y="335" width="820" height="67" rx="10" fill="#173148"/><text x="60" y="364" fill="white" font-size="21" font-weight="bold">4. Sopimus ja allekirjoitus</text><text x="60" y="388" fill="#e4eef9" font-size="16">Liikkeen valitsemat palvelut</text><text x="443" y="417" fill="#9fdcff" font-size="21">↓</text><rect x="40" y="420" width="820" height="67" rx="10" fill="#173148"/><text x="60" y="449" fill="white" font-size="21" font-weight="bold">5. Maksu tai rahoitus</text><text x="60" y="473" fill="#e4eef9" font-size="16">Rahat suoraan myyjäliikkeelle</text><text x="443" y="502" fill="#9fdcff" font-size="21">↓</text><rect x="40" y="505" width="820" height="67" rx="10" fill="#173148"/><text x="60" y="534" fill="white" font-size="21" font-weight="bold">6. Luovutus</text><text x="60" y="558" fill="#e4eef9" font-size="16">Liike sopii asiakkaan kanssa</text><text x="40" y="640" fill="#e4eef9" font-size="18">Tavoitepolku: yhteydet varmennettava. Julkinen demo on ei-sitova.</text></g></svg>