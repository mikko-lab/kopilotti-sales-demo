<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" role="img" aria-labelledby="title desc"><title id="title">A digital salesperson in the full sales journey</title><desc id="desc">Full intended journey: connections must be verified. The public demo is non-binding. Vehicle listing → List price or negotiation → Agreed price → Contract and signature → Payment or financing → Handover</desc><rect width="900" height="690" rx="20" fill="#071b2e"/><g font-family="Arial,sans-serif"><text x="40" y="50" font-size="25" fill="white" font-weight="bold">A digital salesperson in the full sales journey</text><rect x="40" y="80" width="820" height="67" rx="10" fill="#173148"/><text x="60" y="109" fill="white" font-size="21" font-weight="bold">1. Vehicle listing</text><text x="60" y="133" fill="#e4eef9" font-size="16">Vehicle and condition information</text><text x="443" y="162" fill="#9fdcff" font-size="21">↓</text><rect x="40" y="165" width="820" height="67" rx="10" fill="#214bbb"/><text x="60" y="194" fill="white" font-size="21" font-weight="bold">2. List price or negotiation</text><text x="60" y="218" fill="#e4eef9" font-size="16">Sales acts under dealer authority</text><text x="443" y="247" fill="#9fdcff" font-size="21">↓</text><rect x="40" y="250" width="820" height="67" rx="10" fill="#214bbb"/><text x="60" y="279" fill="white" font-size="21" font-weight="bold">3. Agreed price</text><text x="60" y="303" fill="#e4eef9" font-size="16">No repeat of the same negotiation</text><text x="443" y="332" fill="#9fdcff" font-size="21">↓</text><rect x="40" y="335" width="820" height="67" rx="10" fill="#173148"/><text x="60" y="364" fill="white" font-size="21" font-weight="bold">4. Contract and signature</text><text x="60" y="388" fill="#e4eef9" font-size="16">The dealer’s selected services</text><text x="443" y="417" fill="#9fdcff" font-size="21">↓</text><rect x="40" y="420" width="820" height="67" rx="10" fill="#173148"/><text x="60" y="449" fill="white" font-size="21" font-weight="bold">5. Payment or financing</text><text x="60" y="473" fill="#e4eef9" font-size="16">Funds directly to the dealership</text><text x="443" y="502" fill="#9fdcff" font-size="21">↓</text><rect x="40" y="505" width="820" height="67" rx="10" fill="#173148"/><text x="60" y="534" fill="white" font-size="21" font-weight="bold">6. Handover</text><text x="60" y="558" fill="#e4eef9" font-size="16">Arranged by the dealership with the customer</text><text x="40" y="640" fill="#e4eef9" font-size="18">Full intended journey: connections must be verified. The public demo is non-binding.</text></g></svg>