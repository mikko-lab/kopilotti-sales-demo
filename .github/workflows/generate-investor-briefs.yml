name: Generate accessible investor materials

on:
  push:
    branches: [main]
    paths:
      - "docs/source/kopilotti-sales-onepage-fi.html"
      - "docs/source/kopilotti-sales-onepage-en.html"
      - "docs/source/kopilotti-sales-investor-brief-fi.html"
      - "docs/source/kopilotti-sales-investor-brief-en.html"
      - "scripts/render-investor-briefs.mjs"
      - ".github/workflows/generate-investor-briefs.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install rendering and validation dependencies
        run: |
          npm install --no-save --no-package-lock puppeteer-core@24.22.3
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-core fonts-noto-extra poppler-utils

      - name: Resolve Chrome
        id: chrome
        shell: bash
        run: |
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "No Chrome/Chromium executable found" >&2
            exit 1
          fi
          echo "path=$CHROME" >> "$GITHUB_OUTPUT"

      - name: Generate tagged PDFs
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.path }}
        run: node scripts/render-investor-briefs.mjs

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add metadata
        run: |
          python -m pip install --quiet pypdf
          python - <<'PY'
          from pathlib import Path
          from pypdf import PdfReader, PdfWriter
          from pypdf.generic import NameObject, DictionaryObject, BooleanObject

          docs = [
              ("docs/kopilotti-sales-asiakas-sijoittajatiivistelma.pdf",
               "Kopilotti Sales - asiakas- ja sijoittajatiivistelmä",
               "Yhden sivun saavutettava yleiskuva - 20.9.2026"),
              ("docs/kopilotti-sales-customer-investor-summary.pdf",
               "Kopilotti Sales - Customer & Investor Overview",
               "Accessible one-page overview - 20 Sep 2026"),
              ("docs/kopilotti-sales-investor-partner-brief-fi.pdf",
               "Kopilotti Sales - sijoittaja- ja kumppanibrief",
               "Kaksisivuinen saavutettava sijoittaja- ja kumppanibrief - 20.9.2026"),
              ("docs/kopilotti-sales-investor-partner-brief-en.pdf",
               "Kopilotti Sales - Investor & Partner Brief",
               "Accessible two-page investor and partner brief - 20 Sep 2026"),
          ]
          for path, title, subject in docs:
              p = Path(path)
              reader = PdfReader(str(p))
              writer = PdfWriter()
              writer.clone_document_from_reader(reader)
              writer.add_metadata({
                  "/Title": title,
                  "/Author": "Mikko Tarkiainen",
                  "/Subject": subject,
                  "/Creator": "Chromium tagged-PDF workflow",
                  "/Producer": "Skia/PDF + pypdf metadata pass",
              })
              root = writer._root_object
              vp = root.get("/ViewerPreferences")
              if vp is None:
                  vp = DictionaryObject()
                  root[NameObject("/ViewerPreferences")] = vp
              vp[NameObject("/DisplayDocTitle")] = BooleanObject(True)
              tmp = p.with_suffix(".tmp.pdf")
              with tmp.open("wb") as f:
                  writer.write(f)
              tmp.replace(p)
          PY

      - name: Validate PDF accessibility structure
        run: |
          python - <<'PY'
          import subprocess
          from pypdf import PdfReader

          expected = {
              "docs/kopilotti-sales-asiakas-sijoittajatiivistelma.pdf": ("fi-FI", 1),
              "docs/kopilotti-sales-customer-investor-summary.pdf": ("en-US", 1),
              "docs/kopilotti-sales-investor-partner-brief-fi.pdf": ("fi-FI", 2),
              "docs/kopilotti-sales-investor-partner-brief-en.pdf": ("en-US", 2),
          }
          required_uris = {
              "https://kopilotti.online/",
              "https://github.com/mikko-lab/kopilotti-sales-demo",
          }

          for path, (lang, page_count) in expected.items():
              r = PdfReader(path)
              assert len(r.pages) == page_count, (path, "page count", len(r.pages))
              root = r.trailer["/Root"]
              assert root.get("/Lang") == lang, (path, "language", root.get("/Lang"))
              assert root.get("/StructTreeRoot") is not None, (path, "missing StructTreeRoot")
              assert bool((root.get("/MarkInfo") or {}).get("/Marked")), (path, "not marked")
              assert bool((root.get("/ViewerPreferences") or {}).get("/DisplayDocTitle")), (path, "DisplayDocTitle")
              for index, page in enumerate(r.pages):
                  assert page.get("/Tabs") == "/S", (path, "Tabs", index + 1)

              annots = [a for page in r.pages for a in page.get("/Annots", [])]
              assert len(annots) == 2, (path, "link annotation count", len(annots))
              uris = set()
              for annot_ref in annots:
                  annot = annot_ref.get_object()
                  assert annot.get("/StructParent") is not None, (path, "link missing StructParent")
                  action = annot.get("/A")
                  if action and action.get("/URI"):
                      uris.add(str(action.get("/URI")))
              assert required_uris.issubset(uris), (path, "missing link URI", uris)

              struct = subprocess.run(
                  ["pdfinfo", "-struct-text", path],
                  text=True,
                  capture_output=True,
                  check=False,
              )
              assert struct.returncode == 0, (path, "pdfinfo -struct-text failed", struct.returncode)
              assert not struct.stderr.strip(), (path, "PDF structure warning", struct.stderr)
              assert "H1 (block)" in struct.stdout, (path, "missing H1 structure")
              assert "H2 (block)" in struct.stdout, (path, "missing H2 structure")
              assert "Link (inline)" in struct.stdout, (path, "missing Link structure")

              fonts = subprocess.run(["pdffonts", path], text=True, capture_output=True, check=True)
              rows = [line.split() for line in fonts.stdout.splitlines()[2:] if line.strip()]
              assert rows, (path, "no fonts detected")
              for row in rows:
                  assert len(row) >= 7, (path, "unexpected pdffonts row", row)
                  assert row[-5] == "yes", (path, "font not embedded", row)
                  assert row[-3] == "yes", (path, "font missing Unicode map", row)
              print(f"PASS: {path}")
          PY

      - name: Commit generated publications
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             docs/kopilotti-sales-asiakas-sijoittajatiivistelma.pdf             docs/kopilotti-sales-customer-investor-summary.pdf             docs/kopilotti-sales-investor-partner-brief-fi.pdf             docs/kopilotti-sales-investor-partner-brief-en.pdf
          if git diff --cached --quiet; then
            echo "No publication changes"
            exit 0
          fi
          git commit -m "docs: publish investor material set"
          git push
